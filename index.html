<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" href="favicon.png">
  <title>Meow</title>
  <style>
    :root {
      --bg: #0a0a14;
      --bg-alt: #0f0f23;
      --text: #e8e8ff;
      --accent: #00d4ff;
      --accent-glow: #00d4ff88;
      --danger: #ff3366;
      --heal: #33ff99;
      --card: #1a1a2e;
      --glow: #00d4ff22;
      --reset: #ff6b6b;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100dvh;
      padding: 1.5rem;
      overflow: hidden;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 20% 80%, var(--glow) 0%, transparent 50%),
                  radial-gradient(circle at 80% 20%, var(--accent-glow) 0%, transparent 50%);
      pointer-events: none;
      z-index: -1;
      animation: bgFloat 25s ease-in-out infinite;
    }
    @keyframes bgFloat { 0%,100%{transform:translate(0,0)scale(1);} 50%{transform:translate(40px,-40px)scale(1.08);} }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 520px 240px;
      gap: 2.5rem;
      height: 100vh;
      align-items: start;
    }
    @media (max-width: 1100px) {
      .container { grid-template-columns: 1fr; grid-template-rows: auto auto auto 1fr; gap: 1.5rem; height: auto; }
      #upgrades { grid-row: 3; justify-self: center; }
      canvas { width: 100% !important; height: 520px !important; }
    }

    h1 { font-size: 3.8rem; font-weight: 900; background: linear-gradient(135deg, var(--accent), #c084fc); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 24px var(--accent-glow)); }

    .about {
      background: var(--card);
      padding: 2rem;
      border-radius: 20px;
      border: 1px solid #33336644;
      backdrop-filter: blur(16px);
      box-shadow: 0 16px 32px rgba(0,0,0,0.5);
    }

    .game-area { position: relative; display: flex; flex-direction: column; gap: 1rem; }

    canvas {
      background: var(--bg-alt);
      border-radius: 20px;
      box-shadow: 0 0 50px rgba(0,212,255,0.25), inset 0 0 40px rgba(0,0,0,0.7);
      width: 500px;
      height: 640px;
      image-rendering: crisp-edges;
      touch-action: none;
    }

    #upgrades {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background: var(--card);
      padding: 1.5rem;
      border-radius: 16px;
      border: 1px solid #33336644;
      backdrop-filter: blur(12px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.4);
    }

    .score-big {
      text-align: center;
      font-size: 2.4rem;
      font-weight: 900;
      color: var(--accent);
      background: linear-gradient(135deg, var(--accent), #c084fc);
      -webkit-background-clip: text;
      background-clip: text;
      filter: drop-shadow(0 0 20px var(--accent-glow));
      margin-bottom: 0.8rem;
    }

    .max-combo {
      text-align: center;
      font-size: 1.1rem;
      margin: 0.4rem 0 1.2rem;
      opacity: 0.85;
    }

    .upgrade-btn {
      background: linear-gradient(145deg, #2a2a4a, #1e1e38);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 0.9rem 1.2rem;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.18s;
      text-align: left;
      position: relative;
      overflow: hidden;
    }
    .upgrade-btn:disabled { opacity: 0.4; cursor: not-allowed; border-color: #444466; }
    .upgrade-btn:hover:not(:disabled) { background: linear-gradient(145deg, #3a3a5a, #2e2e48); box-shadow: 0 0 20px var(--accent-glow); transform: translateY(-2px); }
    .upgrade-btn::after {
      content: attr(data-cost);
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .reset-btn {
      margin-top: 1rem;
      background: var(--reset);
      color: white;
      border: none;
      padding: 0.8rem;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      text-align: center;
      transition: all 0.2s;
    }
    .reset-btn:hover { background: #ff5252; box-shadow: 0 0 15px rgba(255,107,107,0.5); }

    footer { text-align: center; opacity: 0.6; font-size: 0.9rem; margin-top: 2rem; grid-column: 1 / -1; }

    .game-over {
      position: absolute;
      inset: 0;
      background: rgba(10,10,20,0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 3rem;
      font-weight: bold;
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s;
    }
    .game-over.active { opacity: 1; pointer-events: all; }
    .game-over button {
      margin-top: 2rem;
      padding: 1rem 2.5rem;
      font-size: 1.4rem;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">

  <div>
    <h1>@alanol06</h1>
    <div class="about">
      <p>Веб / программы / игры / C# / SQL</p>
      <p><a href="https://t.me/alanol06" style="color:var(--accent)">t.me/alanol06</a></p>
      <p> </p>
      <p>На 1000000 очков будет мультик</p>
    </div>
  </div>

  <div class="game-area">
    <canvas id="c" width="500" height="640"></canvas>

    <div style="text-align:center; opacity:0.75; font-size:0.95rem; margin-top:0.5rem;">
      Зажми ЛКМ / пробел / палец — автострельба<br>
      Двигай мышкой/пальцем — ловец<br>
      🟦 +очки  •  🟥 урон при касании  •  🟩 лечение  •  🟨 бонус
    </div>

    <div class="game-over" id="gameover">
      <div>GAME OVER</div>
      <button id="restart">Играть снова</button>
    </div>
  </div>

  <div id="upgrades">
    <div class="score-big">Очки: <span id="score">0</span></div>
    <div class="max-combo">Макс. комбо: <span id="maxCombo">0</span></div>
    
    <button class="upgrade-btn" id="btn-fire-rate" data-cost="→ 180">Скорость стрельбы +</button>
    <button class="upgrade-btn" id="btn-spawn"    data-cost="→ 140">Больше кубов +</button>
    <button class="upgrade-btn" id="btn-guns"     data-cost="→ 650">Пушки +1</button>
    
    <button class="reset-btn" id="btn-reset">Сбросить весь прогресс</button>
  </div>

</div>

<footer>2026 • чистый HTML/CSS/JS • прогресс сохраняется</footer>

<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const scoreEl   = document.getElementById('score');
  const maxComboEl = document.getElementById('maxCombo');
  const gameover  = document.getElementById('gameover');
  const restartBtn = document.getElementById('restart');
  const resetBtn   = document.getElementById('btn-reset');

  let score = 0;
  let combo = 0;
  let maxCombo = 0;
  let health = 3;
  let mouseX = 250;
  let isShooting = false;
  let lastShotTime = 0;
  let particles = [];
  let bullets = [];
  let drops = [];
  let gameSpeed = 3.0;

  let saved = JSON.parse(localStorage.getItem('gameUpgrades') || '{}');
  let fireRateLevel  = saved.fireRateLevel  || 0;
  let spawnLevel     = saved.spawnLevel     || 0;
  let gunCount       = saved.gunCount       || 1;

  const fireRateCosts = [180, 320, 520, 820, 1250, 1900];
  const spawnCosts    = [140, 240, 380, 580, 880, 1300, 1900, 2700, 3800, 5200, 7000, 9500, 12800, 17200, 23000]; // 15 уровней!
  const gunCosts      = [650, 1100, 1800, 2800];

  const player = { x: 215, y: 590, w: 70, h: 22 };
  const healthBarHeight = 8;
  const healthBarPadding = 12;

  const TYPES = {
    good:   { color:'#00d4ff', glow:'#00d4ff88', points:6,   type:'good'  },
    bonus:  { color:'#feca57', glow:'#feca5788', points:15,  type:'bonus' },
    bad:    { color:'#ff3366', glow:'#ff336688', points:0,   type:'bad',   damage:1 },
    heal:   { color:'#33ff99', glow:'#33ff9988', points:0,   type:'heal',  heal:1   }
  };

  function saveProgress() {
    localStorage.setItem('gameUpgrades', JSON.stringify({ fireRateLevel, spawnLevel, gunCount }));
  }

  function restartGame() {
    score = 0;
    combo = 0;
    health = 3;
    bullets = [];
    drops = [];
    gameSpeed = 3.0;
    particles = [];
    gameover.classList.remove('active');
    for(let i = 0; i < 2; i++) spawnDrop();
    updateUI();
  }

  function handleShootStart() { isShooting = true; }
  function handleShootEnd()   { isShooting = false; }

  canvas.addEventListener('mousedown',  handleShootStart);
  canvas.addEventListener('mouseup',    handleShootEnd);
  canvas.addEventListener('mouseleave', handleShootEnd);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); handleShootStart(); });
  canvas.addEventListener('touchend',   handleShootEnd);

  window.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); handleShootStart(); }});
  window.addEventListener('keyup',   e => { if (e.code === 'Space') handleShootEnd(); });

  canvas.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect();
    mouseX = e.clientX - r.left;
  });

  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    mouseX = e.touches[0].clientX - r.left;
  }, {passive:false});

  function shoot() {
    const now = Date.now();
    const delay = 180 - fireRateLevel * 28;
    if (now - lastShotTime < delay) return;
    lastShotTime = now;

    const spacing = player.w / (gunCount + 1);
    for (let i = 1; i <= gunCount; i++) {
      bullets.push({
        x: player.x + spacing * i - 4,
        y: player.y - 12,
        w: 8,
        h: 16,
        speed: 9 + fireRateLevel * 0.4
      });
    }
  }

  restartBtn.onclick = restartGame;

  resetBtn.onclick = () => {
    if (!confirm("Сбросить ВЕСЬ прогресс апгрейдов?")) return;
    localStorage.removeItem('gameUpgrades');
    location.reload();
  };

  document.getElementById('btn-fire-rate').onclick = () => {
    if (fireRateLevel >= fireRateCosts.length) return;
    const cost = fireRateCosts[fireRateLevel];
    if (score >= cost) {
      score -= cost;
      fireRateLevel++;
      saveProgress();
      updateUI();
    }
  };

  document.getElementById('btn-spawn').onclick = () => {
    if (spawnLevel >= spawnCosts.length) return;
    const cost = spawnCosts[spawnLevel];
    if (score >= cost) {
      score -= cost;
      spawnLevel++;
      saveProgress();
      updateUI();
    }
  };

  document.getElementById('btn-guns').onclick = () => {
    if (gunCount >= gunCosts.length + 1) return;
    const cost = gunCosts[gunCount - 1];
    if (score >= cost) {
      score -= cost;
      gunCount++;
      saveProgress();
      updateUI();
    }
  };

  function updateUI() {
    scoreEl.textContent = score | 0;
    maxComboEl.textContent = maxCombo;

    document.getElementById('btn-fire-rate').disabled = fireRateLevel >= fireRateCosts.length;
    document.getElementById('btn-spawn').disabled    = spawnLevel   >= spawnCosts.length;
    document.getElementById('btn-guns').disabled     = gunCount     >= gunCosts.length + 1;

    document.getElementById('btn-fire-rate').dataset.cost = fireRateLevel < fireRateCosts.length ? `→ ${fireRateCosts[fireRateLevel]}` : 'MAX';
    document.getElementById('btn-spawn').dataset.cost    = spawnLevel   < spawnCosts.length    ? `→ ${spawnCosts[spawnLevel]}` : 'MAX';
    document.getElementById('btn-guns').dataset.cost     = gunCount     < gunCosts.length + 1  ? `→ ${gunCosts[gunCount-1]}` : 'MAX';
  }

  function getComboColor() {
    const tier = Math.floor(combo / 25) % 8; // каждые 25 очков
    const colors = [
      '#00d4ff',    // cyan
      '#7c3aed',    // violet
      '#feca57',    // gold
      '#ff3366',    // hot pink
      '#33ff99',    // mint
      '#ff6b6b',    // coral
      '#a78bfa',    // lavender
      '#ffd23f'     // amber
    ];
    return colors[tier];
  }

  function getBadSpawnChance() {
    // базовый 38% + растёт с комбо (до 65%+ при высоком комбо)
    return 0.38 + Math.min(combo * 0.002, 0.27);
  }

  function spawnDrop() {
    const size = 24 + Math.random() * 28 | 0;
    let typeKey = 'good';
    const r = Math.random();
    const badChance = getBadSpawnChance();
    
    if (r < badChance)         typeKey = 'bad';
    else if (r < badChance + 0.08) typeKey = 'heal';
    else if (r < badChance + 0.32) typeKey = 'bonus';

    drops.push({
      x: Math.random() * (canvas.width - size),
      y: -size,
      vx: (Math.random()-0.5)*1.8,
      size, rot:0, glow:1,
      ...TYPES[typeKey]
    });
  }

  function createParticles(x,y,color,count=12) {
    for(let i=0;i<count;i++){
      particles.push({
        x,y,
        vx:(Math.random()-0.5)*7,
        vy:(Math.random()-0.5)*7 -2,
        life:1,
        size:Math.random()*5+3,
        color
      });
    }
  }

  function update() {
    player.x += (mouseX - player.x - player.w/2) * 0.28;
    player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));

    if (isShooting) shoot();

    for(let i=bullets.length-1;i>=0;i--){
      const b = bullets[i];
      b.y -= b.speed;
      if(b.y < -20) bullets.splice(i,1);
    }

    for(let i=drops.length-1;i>=0;i--){
      const d = drops[i];
      d.y += gameSpeed;
      d.x += d.vx;
      d.rot += 0.08;
      d.glow = Math.sin(Date.now()*0.008 + i)*0.3 + 0.7;

      if (d.y + d.size > player.y && d.y < player.y + player.h &&
          d.x + d.size > player.x && d.x < player.x + player.w) {

        if (d.type === 'bad') {
          health -= d.damage || 1;
          combo = 0;
          createParticles(d.x + d.size/2, d.y + d.size/2, '#ff3366', 18);
          if (health <= 0) gameover.classList.add('active');
        }
        else {
          combo++;
          if (combo > maxCombo) {
            maxCombo = combo;
            updateUI();
          }

          const comboMultiplier = 1 + (combo / 10) * 0.05;
          score += Math.floor(d.points * (d.type==='bonus'?1.5:1) * comboMultiplier);

          gameSpeed += 0.0012;
          createParticles(d.x + d.size/2, d.y + d.size/2, d.glow, 16);

          if (d.type === 'heal') {
            health = Math.min(3, health + 1);
            createParticles(d.x + d.size/2, d.y + d.size/2, '#33ff99', 14);
          }
        }

        drops.splice(i,1);
        updateUI();
        continue;
      }

      if (d.type === 'bad') {
        for(let j=bullets.length-1;j>=0;j--){
          const b = bullets[j];
          if (b.x < d.x + d.size && b.x + b.w > d.x &&
              b.y < d.y + d.size && b.y + b.h > d.y) {
            createParticles(d.x + d.size/2, d.y + d.size/2, '#ff88aa', 10);
            score += 12;
            combo++;
            if (combo > maxCombo) {
              maxCombo = combo;
              updateUI();
            }
            drops.splice(i,1);
            bullets.splice(j,1);
            updateUI();
            break;
          }
        }
      }

      if (d.y > canvas.height + d.size) drops.splice(i,1);
    }

    particles = particles.filter(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life -= 0.025; p.vx *= 0.98;
      return p.life > 0;
    });

    // общий спавн (все кубы)
    const baseSpawnRate = 0.014 + spawnLevel * 0.009 + combo * 0.0008;
    if (Math.random() < baseSpawnRate) spawnDrop();

    updateUI();
  }

  function draw() {
    const grad = ctx.createLinearGradient(0,0,0,canvas.height);
    grad.addColorStop(0,'#0f0f23'); grad.addColorStop(1,'#0a0a14');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.strokeStyle = 'rgba(100,180,255,0.04)';
    for(let x=0;x<canvas.width;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke();}
    for(let y=0;y<canvas.height;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();}

    if (combo > 0) {
      ctx.save();
      ctx.globalAlpha = 0.11 + Math.min(combo / 35, 0.38);
      ctx.font = 'bold 180px system-ui';
      ctx.fillStyle = getComboColor();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(combo, canvas.width/2, canvas.height/2);
      ctx.restore();
    }

    particles.forEach(p=>{
      ctx.globalAlpha = p.life;
      ctx.shadowColor = p.color; ctx.shadowBlur=10;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x-p.size/2, p.y-p.size/2, p.size,p.size);
    });
    ctx.globalAlpha = 1; ctx.shadowBlur=0;

    ctx.fillStyle = '#a5d8ff';
    ctx.shadowColor = '#a5d8ff'; ctx.shadowBlur=12;
    bullets.forEach(b=>ctx.fillRect(b.x, b.y, b.w, b.h));
    ctx.shadowBlur=0;

    drops.forEach(d=>{
      ctx.save();
      ctx.translate(d.x + d.size/2, d.y + d.size/2);
      ctx.rotate(d.rot);
      ctx.shadowColor = d.glow; ctx.shadowBlur = 22 * d.glow;
      ctx.fillStyle = d.color;
      ctx.fillRect(-d.size/2, -d.size/2, d.size, d.size);
      ctx.shadowBlur=0;
      ctx.strokeStyle='rgba(255,255,255,0.35)';
      ctx.lineWidth=2;
      ctx.strokeRect(-d.size/2, -d.size/2, d.size, d.size);
      ctx.restore();
    });

    const barWidth = player.w * 1.4;
    const barX = player.x + player.w/2 - barWidth/2;
    const barY = player.y - healthBarPadding - healthBarHeight;
    ctx.fillStyle = 'rgba(40,40,60,0.7)';
    ctx.fillRect(barX, barY, barWidth, healthBarHeight);
    
    const healthRatio = health / 3;
    ctx.fillStyle = healthRatio > 0.66 ? '#33ff99' : healthRatio > 0.33 ? '#ffcc00' : '#ff3366';
    ctx.fillRect(barX, barY, barWidth * healthRatio, healthBarHeight);
    
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(barX, barY, barWidth, healthBarHeight);

    ctx.shadowColor = '#00d4ff'; ctx.shadowBlur = 30;
    ctx.fillStyle = '#00d4ff';
    ctx.fillRect(player.x, player.y, player.w, player.h);

    const pgrad = ctx.createLinearGradient(player.x, player.y, player.x+player.w, player.y);
    pgrad.addColorStop(0,'rgba(255,255,255,0.7)');
    pgrad.addColorStop(1,'rgba(0,212,255,0.3)');
    ctx.fillStyle = pgrad;
    ctx.fillRect(player.x, player.y, player.w, player.h);
    ctx.shadowBlur=0;
  }

  function loop(){
    if (!gameover.classList.contains('active')) {
      update();
      draw();
    }
    requestAnimationFrame(loop);
  }

  restartGame();
  loop();
</script>
</body>

</html>
